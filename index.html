<html lang="en">
<head>

      padding: 0;
      box-sizing: border-box;
    }

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f8fc;
      color: #0b1a33;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      max-width: 1440px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 60px -12px rgba(0, 20, 40, 0.18);
      overflow: hidden;
      transition: all 0.2s;
    }

    /* header */
    .app-header {
      padding: 24px 28px 18px 28px;
      border-bottom: 1px solid #e8f0f6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: white;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b1a33;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 i {
      color: #1a7f64;
      font-size: 1.8rem;
    }
    .brand .sub {
      font-size: 0.85rem;
      color: #4d6478;
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: 0.2px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .brand .sub span {
      font-weight: 400;
      color: #4f7b96;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .stat-badge {
      background: #eef6f9;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1a4b5e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-badge i {
      color: #1a7f64;
    }
    .clear-btn {
      background: transparent;
      border: 1px solid #d0dfe9;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      color: #2c4a62;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .clear-btn:hover {
      background: #f0f6fb;
      border-color: #b0c8d9;
    }

    /* controls */
    .controls {
      padding: 14px 28px 20px 28px;
      background: #fafdff;
      border-bottom: 1px solid #e8f0f6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 18px;
    }
    .search-wrapper {
      flex: 2 1 280px;
      position: relative;
      min-width: 180px;
    }
    .search-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #7b95ab;
      font-size: 0.95rem;
    }
    .search-wrapper input {
      width: 100%;
      padding: 11px 18px 11px 44px;
      border: 1.5px solid #dce7f0;
      border-radius: 60px;
      font-size: 0.9rem;
      background: white;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
      outline: none;
    }
    .search-wrapper input:focus {
      border-color: #1a7f64;
      box-shadow: 0 0 0 4px rgba(26, 127, 100, 0.10);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex: 1 1 auto;
    }
    .filter-group select {
      padding: 9px 16px 9px 16px;
      border: 1.5px solid #dce7f0;
      border-radius: 60px;
      background: white;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1a3a4e;
      outline: none;
      cursor: pointer;
      min-width: 160px;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
    }
    .filter-group select:focus {
      border-color: #1a7f64;
      box-shadow: 0 0 0 3px rgba(26, 127, 100, 0.08);
    }
    .result-counter {
      font-size: 0.85rem;
      font-weight: 500;
      color: #2e5773;
      background: #eaf2f8;
      padding: 5px 16px;
      border-radius: 40px;
      white-space: nowrap;
    }

    /* table */
    .table-wrap {
      overflow-x: auto;
      padding: 0 4px 4px 4px;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 780px;
    }
    th {
      text-align: left;
      padding: 14px 14px 12px 14px;
      background: #f8fbfd;
      font-weight: 600;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #2f5773;
      border-bottom: 2px solid #e2ecf5;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid #ecf3f9;
      vertical-align: middle;
      line-height: 1.4;
      cursor: pointer;
      transition: background 0.1s;
    }
    tr:hover td {
      background: #f5faff;
    }
    .code-badge {
      background: #ecf4fa;
      padding: 2px 10px;
      border-radius: 30px;
      font-family: 'Inter', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      color: #1a5a7a;
      display: inline-block;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .specialty-pill {
      background: #ddecf5;
      color: #12455f;
      padding: 3px 12px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 600;
      display: inline-block;
      white-space: nowrap;
    }
    .implant-badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 700;
      text-align: center;
      min-width: 40px;
    }
    .implant-yes {
      background: #daf1e8;
      color: #0b5e48;
    }
    .implant-no {
      background: #eaf1f7;
      color: #3b617a;
    }
    .amount-cell {
      font-weight: 700;
      color: #0b2a40;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }
    .package-name {
      font-weight: 600;
      color: #0a2538;
    }
    .proc-name {
      color: #1a3e55;
      max-width: 260px;
    }

    /* empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px 70px;
      color: #6f8fa6;
    }
    .empty-state i {
      font-size: 3rem;
      color: #c6dae8;
      margin-bottom: 14px;
    }
    .empty-state h3 {
      font-weight: 500;
      color: #244c66;
    }

    /* modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 30, 46, 0.50);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: white;
      max-width: 600px;
      width: 100%;
      border-radius: 28px;
      box-shadow: 0 30px 70px rgba(0, 20, 30, 0.35);
      padding: 28px 30px 24px;
      animation: modalIn 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes modalIn {
      0% { opacity: 0; transform: scale(0.96) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

      float: right;
      background: none;
      border: none;
      font-size: 1.8rem;
      line-height: 1;
      color: #8aaec4;
      cursor: pointer;
      padding: 0 6px;
      transition: 0.15s;
    }
    .modal-close:hover {
      color: #1a4058;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0b1f33;
      margin-bottom: 4px;
      padding-right: 30px;
    }
    .modal-sub {
      color: #3f6a84;
      font-size: 0.85rem;
      margin-bottom: 18px;
      border-bottom: 1px solid #e4eef8;
      padding-bottom: 12px;
    }
    .modal-detail {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid #ecf3fa;
      gap: 12px;
    }
    .modal-detail:last-child {
      border-bottom: none;
    }
    .modal-label {
      font-weight: 600;
      min-width: 120px;
      color: #2a5775;
      flex-shrink: 0;
      font-size: 0.9rem;
    }
    .modal-value {
      color: #0b1e30;
      word-break: break-word;
      font-size: 0.9rem;
    }

      padding: 2px 12px;
      border-radius: 30px;
      font-family: monospace;
      font-weight: 600;
      font-size: 0.75rem;

      .result-counter { align-self: flex-start; }
      .modal-card { padding: 22px 18px; }
      .modal-detail { flex-direction: column; gap: 2px; }
      .modal-label { min-width: auto; }
      td, th { padding: 8px 10px; font-size: 0.7rem; }
      .table-wrap { padding: 0; }
      .stat-badge { font-size: 0.7rem; padding: 4px 12px; }
    }

      body { padding: 8px; }

      .stat-badge { font-size: 0.65rem; padding: 3px 10px; }
      .clear-btn { font-size: 0.7rem; padding: 4px 12px; }
      .search-wrapper input { padding: 10px 14px 10px 38px; font-size: 0.85rem; }
      .filter-group select { font-size: 0.8rem; padding: 8px 14px; }
      .result-counter { font-size: 0.75rem; padding: 4px 12px; }
      td, th { padding: 6px 8px; font-size: 0.65rem; }
      .code-badge { font-size: 0.6rem; padding: 1px 8px; }
      .specialty-pill { font-size: 0.6rem; padding: 2px 8px; }
      .implant-badge { font-size: 0.6rem; min-width: 32px; padding: 1px 8px; }
      .modal-title { font-size: 1.2rem; }
      .modal-card { padding: 18px 14px; }
    }

    /* touch-friendly row */
    @media (hover: none) {
      tr:hover td { background: inherit; }
      tr:active td { background: #eef6fc; }
    }
  </style>
</head>

      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR003", procedureCode: "MR003D", packageName: "2D External Beam Radiotherapy (Telecobalt / Strock LA) (25 Fractions) (Inclusive of Simulation", procedureName: "Additional fractions - 10 Max upto (additional fraction at Rs.500 per Fraction upto a max)", amount: 0, implant: "Y" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR004", procedureCode: "MR004A", packageName: "Linear Accelerator, External Beam Radiotherapy 3D CRT (6 Fractions) (Inclusive of Simulation", procedureName: "Radical", amount: 12100, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR004", procedureCode: "MR004B", packageName: "Linear Accelerator, External Beam Radiotherapy 3D CRT (6 Fractions) (Inclusive of Simulation", procedureName: "Adjuvant", amount: 23100, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR004", procedureCode: "MR004C", packageName: "Linear Accelerator, External Beam Radiotherapy 3D CRT (6 Fractions) (Inclusive of Simulation", procedureName: "Neoadjuvant", amount: 23100, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR004", procedureCode: "MR004D", packageName: "Linear Accelerator, External Beam Radiotherapy 3D CRT (6 Fractions) (Inclusive of Simulation", procedureName: "Additional fractions - 18 Max upto (Every additional fraction at Rs.1,000 per Fraction)", amount: 0, implant: "Y" },

      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR005", procedureCode: "MR005B", packageName: "Linear Accelerator, External Beam Radiotherapy 3D CRT (25 Fractions) (Inclusive of Simulation", procedureName: "Adjuvant", amount: 44000, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR005", procedureCode: "MR005C", packageName: "Linear Accelerator, External Beam Radiotherapy 3D CRT (25 Fractions) (Inclusive of Simulation", procedureName: "Neoadjuvant", amount: 44000, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR005", procedureCode: "MR005D", packageName: "Linear Accelerator, External Beam Radiotherapy 3D CRT (25 Fractions) (Inclusive of Simulation", procedureName: "Additional fractions - 10 Max upto (Every additional fraction at Rs.1,000 per Fraction)", amount: 0, implant: "Y" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR006", procedureCode: "MR006A", packageName: "Linear Accelerator, External Beam Radiotherapy IMRT (Intensity Modulated Radiotherapy) (20 Fractions) (Inclusive of Simulation)", procedureName: "Radical", amount: 77000, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR006", procedureCode: "MR006B", packageName: "Linear Accelerator, External Beam Radiotherapy IMRT (Intensity Modulated Radiotherapy) (20 Fractions) (Inclusive of Simulation)", procedureName: "Adjuvant", amount: 77000, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR006", procedureCode: "MR006C", packageName: "Linear Accelerator, External Beam Radiotherapy IMRT (Intensity Modulated Radiotherapy) (20 Fractions) (Inclusive of Simulation)", procedureName: "Neoadjuvant", amount: 77000, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR006", procedureCode: "MR006D", packageName: "Linear Accelerator, External Beam Radiotherapy IMRT (Intensity Modulated Radiotherapy) (20 Fractions) (Inclusive of Simulation)", procedureName: "Additional fractions - 15 (Every additional fraction at Rs.2,000 per Fraction)", amount: 0, implant: "Y" },

      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR007", procedureCode: "MR007B", packageName: "Linear Accelerator, External Beam Radiotherapy IMRT (Intensity Modulated Radiotherapy) (6 Fractions) (Inclusive of Simulation)", procedureName: "Adjuvant", amount: 46200, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR007", procedureCode: "MR007C", packageName: "Linear Accelerator, External Beam Radiotherapy IMRT (Intensity Modulated Radiotherapy) (6 Fractions) (Inclusive of Simulation)", procedureName: "Neoadjuvant", amount: 46200, implant: "N" },
      { specialty: "Radiation Oncology", specialtyCode: "MR", packageCode: "MR007", procedureCode: "MR007D", packageName: "Linear Accelerator, External Beam Radiotherapy IMRT (Intensity Modulated Radiotherapy) (6 Fractions) (Inclusive of Simulation)", procedureName: "Additional fractions - 18 Max upto (Every additional fraction at Rs.2000 per Fraction)", amount: 0, implant: "Y" },
    ];

    // ─── HELPERS ──────────────────────────────────────────────────────────
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function truncate(text, len = 55) {
      if (!text) return '';
      return text.length > len ? text.slice(0, len) + '…' : text;
    }

    // ─── DOM REFS ──────────────────────────────────────────────────────────
    const tbody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const specialtyFilter = document.getElementById('specialtyFilter');
    const resultCounter = document.getElementById('resultCounter');
    const totalCount = document.getElementById('totalCount');
    const totalRecordsLabel = document.getElementById('totalRecordsLabel');
    const emptyState = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearFiltersBtn');

    const modalOverlay = document.getElementById('modalOverlay');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const modalBody = document.getElementById('modalBody');

    // ─── POPULATE SPECIALTIES ─────────────────────────────────────────────
    const specSet = new Set();
    rawData.forEach(r => specSet.add(r.specialty));
    [...specSet].sort().forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      specialtyFilter.appendChild(opt);
    });

    totalCount.textContent = rawData.length;
    totalRecordsLabel.textContent = `${rawData.length} packages`;

    // ─── RENDER ────────────────────────────────────────────────────────────
    function render(data) {
      tbody.innerHTML = '';
      if (data.length === 0) {
        emptyState.style.display = 'block';
        resultCounter.textContent = '0 results';
        return;
      }
      emptyState.style.display = 'none';

      data.forEach((row) => {
        const tr = document.createElement('tr');
        tr.addEventListener('click', () => openModal(row));

        const implantClass = row.implant === 'Y' ? 'implant-yes' : 'implant-no';
        const implantLabel = row.implant === 'Y' ? 'Yes' : 'No';

        tr.innerHTML = `
          <td><span class="specialty-pill">${escapeHtml(row.specialty)}</span></td>
          <td><span class="code-badge">${escapeHtml(row.packageCode)}</span></td>
          <td><span class="code-badge">${escapeHtml(row.procedureCode)}</span></td>
          <td class="package-name">${escapeHtml(truncate(row.packageName, 32))}</td>
          <td class="proc-name">${escapeHtml(truncate(row.procedureName, 50))}</td>
          <td style="text-align:right;" class="amount-cell">₹${Number(row.amount).toLocaleString('en-IN')}</td>
          <td style="text-align:center;"><span class="implant-badge ${implantClass}">${implantLabel}</span></td>
        `;
        tbody.appendChild(tr);
      });

      resultCounter.textContent = `${data.length} results`;
    }

    // ─── FILTER ─────────────────────────────────────────────────────────────
    function applyFilters() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      const specialtyVal = specialtyFilter.value;

      const filtered = rawData.filter(row => {
        if (specialtyVal && row.specialty !== specialtyVal) return false;
        if (searchTerm) {
          const haystack = [
            row.specialty, row.specialtyCode, row.packageCode, row.procedureCode,
            row.packageName, row.procedureName, String(row.amount), row.implant
          ].join(' ').toLowerCase();
          if (!haystack.includes(searchTerm)) return false;
        }
        return true;
      });

      render(filtered);
    }

    // ─── CLEAR ─────────────────────────────────────────────────────────────
    function clearFilters() {
      searchInput.value = '';
      specialtyFilter.value = '';
      applyFilters();
    }

    // ─── MODAL ─────────────────────────────────────────────────────────────
    function openModal(row) {
      modalTitle.textContent = row.packageName;
      modalSub.textContent = `Procedure ${row.procedureCode} · Package ${row.packageCode}`;
      modalBody.innerHTML = `
        <div class="modal-detail">
          <div class="modal-label">Specialty</div>
          <div class="modal-value"><span class="specialty-pill">${escapeHtml(row.specialty)}</span></div>
        </div>
        <div class="modal-detail">
          <div class="modal-label">Package Name</div>
          <div class="modal-value"><strong>${escapeHtml(row.packageName)}</strong></div>
        </div>
        <div class="modal-detail">
          <div class="modal-label">Procedure Name</div>
          <div class="modal-value">${escapeHtml(row.procedureName)}</div>
        </div>
        <div class="modal-detail">
          <div class="modal-label">Amount</div>
          <div class="modal-value" style="font-weight:700;font-size:1.1rem;">₹${Number(row.amount).toLocaleString('en-IN')}</div>
        </div>
        <div class="modal-detail">
          <div class="modal-label">Implant</div>
          <div class="modal-value"><span class="implant-badge ${row.implant === 'Y' ? 'implant-yes' : 'implant-no'}">${row.implant === 'Y' ? 'Yes' : 'No'}</span></div>
        </div>
        <div class="modal-detail">
          <div class="modal-label">Codes</div>
          <div class="modal-value"><span class="code-inline">Specialty: ${escapeHtml(row.specialtyCode)}</span>  <span class="code-inline">Package: ${escapeHtml(row.packageCode)}</span>  <span class="code-inline">Procedure: ${escapeHtml(row.procedureCode)}</span></div>
        </div>
      `;
      modalOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    // ─── EVENT BINDING ────────────────────────────────────────────────────
    searchInput.addEventListener('input', applyFilters);
    specialtyFilter.addEventListener('change', applyFilters);
    clearBtn.addEventListener('click', clearFilters);

    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (modalOverlay.classList.contains('active')) closeModal();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // ─── INIT ──────────────────────────────────────────────────────────────
    render(rawData);
  })();
</script>
